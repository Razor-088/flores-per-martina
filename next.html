<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flors per Martina</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="container">
  <div class="night"></div>
  <div class="time-panel">
    <p class="time-title">Portem junts</p>
    <div class="time-grid">
      <div class="t-cell"><span id="t-days" class="t-num">0</span><span class="t-label">dies</span></div>
      <div class="t-cell"><span id="t-hours" class="t-num">0</span><span class="t-label">hores</span></div>
      <div class="t-cell"><span id="t-mins" class="t-num">0</span><span class="t-label">min</span></div>
      <div class="t-cell"><span id="t-secs" class="t-num">0</span><span class="t-label">seg</span></div>
    </div>
    <p class="time-foot">Recorda que t'estimo mooolt 💕</p>
  </div>
  <script src="script.js"></script>
  <script src="counter.js"></script>
</body>
</html>
